# SoloLedger CI —— §2B：让 20+ 个 check:* 守卫 + 迁移测试 + e2e 在每次推送/PR 自动跑，
# 不再只靠人工。全程不启动 Electron：
#   - 守卫与迁移测试在 node 下跑；better-sqlite3 重建为 node ABI 供迁移测试用真引擎。
#   - e2e 由 Playwright 驱动 vite preview（electronAPI 被 mock），同样不需要 Electron 运行时。
# 故用 `npm ci --ignore-scripts` 跳过 postinstall（electron-builder install-app-deps 会把
# better-sqlite3 重建为 Electron ABI，CI 不需要）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Guards + migrations + build
    runs-on: macos-latest
    # The repository's default workflow token is read-only (measured:
    # `default_workflow_permissions: read`), and the Core test step needs to be able to
    # append to issue #400's ledger when it auto-retries the flake tracked there — an
    # auto-rerun that leaves no trace is exactly what that issue forbids. A job-level
    # `permissions:` block replaces the defaults wholesale, so `contents: read` has to
    # be restated for actions/checkout. Everything else stays `none`.
    #
    # A pull request from a FORK gets a read-only token whatever this says. That makes
    # the recording fail and the job go red rather than re-run silently, which is the
    # direction this mechanism should fail in; this repository has never taken one.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # --ignore-scripts 跳过了 electron 自身的 install（下载二进制）；多个守卫 + 迁移测试
      # 会 require('electron')（仅取路径字符串），二进制缺失会抛「Electron failed to install
      # correctly」。npm rebuild electron 补下二进制；同时把 better-sqlite3 重建为 node ABI
      # 供迁移测试在 node 下跑真引擎。两者都不触发 electron-builder install-app-deps。
      - name: Install Electron binary + rebuild better-sqlite3 for node ABI
        run: npm rebuild electron better-sqlite3
      # 前端构建放在守卫之前：check:offline 需要扫 dist/index.html。
      - name: Build renderer
        run: npm run build
      # 类型检查门禁（tsc --noEmit）：vite/esbuild 编译不做类型检查，这里补上。
      # 纯类型检查，无原生/浏览器/ABI 依赖；放在 build 之后、check:all 之前。
      - name: Typecheck
        run: npm run typecheck
      - name: Run all guards + migration test
        run: npm run check:all
      # settings-coercion oracle. Recorded from the REPO-LOCKED Electron, never from plain
      # node: the two runtimes do not share a V8 (node 24 ships 13.6, electron 42 ships
      # 14.8), and this corpus is a claim about what the shipping product does. The Electron
      # binary is already present — the rebuild step above downloads it — and this generator
      # touches neither better-sqlite3 (node ABI here) nor ICU, so it needs nothing further.
      # A separate step rather than a link in `check:all`, matching how the toLocaleString
      # corpus is wired: none of check:all's other 43 guards needs the Electron binary, and
      # making one of them need it would hide that dependency inside the chain.
      - name: settings-coercion corpus reproducible (locked Electron)
        run: npm run check:settings-coercion
      # Native SwiftUI Core package: unit + guard tests. Includes the schema-version
      # parity guard, which reads Electron's authoritative SCHEMA_VERSION via `node`
      # (set up above) — so native/Electron schema drift fails the PR here. macos-latest
      # ships Xcode, so `swift test` has XCTest without a DEVELOPER_DIR override.
      # Warning gate BEFORE the test run: baseline 0 by fingerprint, so a new
      # warning is a signal and a baselined one that disappears forces its entry
      # to be removed. It builds from a throwaway scratch path, because an
      # incremental build does not re-emit warnings for files it did not compile.
      - name: Native Swift warning gate
        env:
          SWIFT_WARNING_SCRATCH_PATH: .swift-gate-build
        run: npm run check:swift-warnings
      # Reuses the gate's build directory (the wrapper passes the same
      # SWIFT_WARNING_SCRATCH_PATH value, and FlakeRetryGateGuardTests pins the two
      # together), so the full compile above is paid for once rather than twice.
      #
      # T1.5 — the `swift test` invocation moved into scripts/swift-test-with-retry.mjs,
      # which runs it, and retries EXACTLY ONE named test EXACTLY ONCE: the flake tracked
      # in issue #400, and only when it is the sole failure. The escalation clause on that
      # issue ("if the recurrence rate starts hurting the merge queue, escalate to
      # job-level single-test retry + mandatory accounting") is what asked for this; the
      # other clause on it ("an auto-rerun that leaves no trace is never allowed") is why
      # the wrapper can only exit 0 after the recurrence has been written to that issue,
      # to this job's summary and to the log. Recording fails ⇒ the job fails.
      #
      # The test stays in the required checks and is not downgraded: any other failure,
      # two failures, a crash, or a retry that stays red all go straight to red.
      - name: Native SwiftUI Core tests (swift test, #400 flake retry + accounting)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/swift-test-with-retry.mjs

  e2e:
    name: Locale-matrix e2e (Playwright)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build + e2e
        run: npm run test:locale-ui

  # 报表黄金可复现性。原生报表镜像逐字段对照这些黄金，所以黄金本身必须可复现：
  # 用 package.json 锁定的同一 Electron 二进制重跑生成器，产物必须与提交的字节一致。
  #   - 必须走 ELECTRON ABI（与 checks job 的 node ABI 互斥，故独立 job）。
  #     electron/reports/us.js 用 toLocaleString() 产出可见字符串（如 "$3,647.6"），
  #     换个运行时的 ICU 就可能改数字，所以运行时家族必须与本地生成时一致。
  #   - 非空 diff 意味着:要么引擎变了（镜像 PR 不允许），要么环境没锁住。
  report-goldens:
    name: Report goldens reproducible
    runs-on: macos-latest
    # NO path filtering, at either level, on purpose.
    #
    # A workflow-level `paths:` filter would make a required check simply not
    # report, leaving it "Expected" forever and blocking every merge. An in-job
    # filter avoids that but has a worse failure mode: the goldens depend on the
    # engines, the generator, the fixture AND the runtime (an Electron bump in
    # package-lock.json changes ICU, which changes "$3,647.6"), so any path list
    # that misses a dependency lets a real drift through as a GREEN merge.
    # Enumerating today's dependencies is easy; guaranteeing the list stays
    # complete as the repo changes is not — so the job always does the full work.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the allowlist step needs the merge base with the target branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Semantics of the allowlist, pinned without git or a network — cheap, and it
      # runs before the expensive steps so a broken rule fails fast.
      - name: Golden-allowlist semantics
        run: node scripts/test-golden-changes.mjs
      - name: Install Electron binary
        run: npm rebuild electron
      # The toLocaleString corpus lives in THIS job and not in `check:all`, for the
      # same reason the goldens do: it records ICU output, and ICU comes from the
      # pinned Electron binary. Under the `checks` job's plain node it would be
      # recorded against a different ICU and drift silently. No new required check —
      # this is a step inside the existing one.
      - name: toLocaleString corpus reproducible
        run: npm run check:tolocalestring
      - name: Rebuild better-sqlite3 for Electron ABI
        run: npm run electron:rebuild
      - name: Regenerate report goldens
        run: |
          LC_ALL=C LANG=C TZ=UTC ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron \
            native/SoloLedger/Tests/Fixtures/make-report-goldens.mjs
      - name: Goldens must be byte-identical
        run: |
          git diff --exit-code -- native/SoloLedger/Tests/SoloLedgerCoreTests/Fixtures/reports/goldens \
            || { echo '::error::report goldens are not reproducible — see the diff above'; exit 1; }
      # A mirroring PR must not move the goldens at all; a deliberate correction may
      # move only the series it declares in a commit trailer. No trailer = nothing
      # may change, which is exactly today's behaviour for every existing PR.
      - name: Golden changes must be declared
        env:
          GOLDEN_BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: node scripts/check-golden-changes.mjs

  # 真 SwiftUI App 的编译 + App-hosted 单元测试。
  #
  # `swift test`（checks job）只覆盖 SwiftPM 包 SoloLedgerCore —— Package.swift 明确
  # 声明 Sources/SoloLedger/ 不属于任何 SwiftPM target，由 App/SoloLedger.xcodeproj
  # 编译。所以在此 job 之前，**整个 SwiftUI App 层没有任何 CI 覆盖**：View、AppModel、
  # 启动链、六语 .strings parity 测试全部只在本机跑过。R8 要在这一层做报表呈现，
  # 先把编译与单元测试的闸门装上。
  #
  # 只跑 SoloLedgerUnitTests，**显式排除 SoloLedgerUITests**：scheme 的 TestAction
  # 两个 testable 都未 skip，不加 -only-testing 就会顺带拉起 XCUITest。而 XCUITest 需要
  # runner 打开 automation mode，实测在无 GUI 会话下会挂住（2026-07-21：GUI 会话 12/12
  # 通过，headless 超时）。UITests 是否能进 CI 另开探索性 job 验证，不在本 job 范围内。
  #
  # 本 job 已在 required checks 内（四项之一，与 checks / e2e / report-goldens 并列）。
  # 它是按 CLAUDE.md「Required status checks」的顺序落地的：workflow 先合入 main、在
  # main 上跑成功，之后才配置为必需；反过来会让每个 PR 永久卡在 "Expected"。
  #
  # 不做 paths 过滤，与 report-goldens 同理：一个被路径过滤掉的必需检查根本不会上报。
  native-app:
    name: Native SwiftUI app (xcodebuild + unit tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 工具链版本入日志：这个 job 唯一的外部依赖就是 runner 自带的 Xcode，
      # 将来若因镜像升级而红，第一件要看的就是它变成了什么。
      - name: Xcode version
        run: xcodebuild -version
      # DerivedData 放 RUNNER_TEMP，不落进工作区 —— 仓库根的 .swift-gate-build 是
      # swift build 的 scratch path，两者互不复用也不该互相污染。
      - name: Build the real SwiftUI app
        run: |
          xcodebuild \
            -project native/SoloLedger/App/SoloLedger.xcodeproj \
            -scheme SoloLedger \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SoloLedgerDerivedData" \
            build
      - name: App-hosted unit tests (SoloLedgerUnitTests only)
        run: |
          xcodebuild test \
            -project native/SoloLedger/App/SoloLedger.xcodeproj \
            -scheme SoloLedger \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SoloLedgerDerivedData" \
            -only-testing:SoloLedgerUnitTests
      # 2c-6 / D10 —— Release 构型的编译门。
      #
      # 到这一步为止，仓里没有任何东西编译 Release：CI 两处都是 -configuration Debug，
      # `swift test` 根本看不见 App 目标。而两个构型不是同一份代码 —— `#if DEBUG`
      # 决定数据夹名、Powerbox 面板覆写与调试脚手架 —— 所以一个只在 Release 下才
      # 报的编译错误可以在 main 里躺任意久，第一次现形是在归档上传那一刻，也就是
      # 最不该发现它的地方。
      #
      # **只 build。不 test、不 archive、不启动。** Release 带的是生产 bundle id
      # com.alotie418.sololedger，任何从它「运行」起来的东西都会把 Application Support
      # 解析进与 Electron MAS 线共用的真实容器 —— 这正是 SchemeConfigurationGuardTests
      # 在 scheme 那一侧钉住的同一条红线。编译不碰任何容器。
      #
      # CODE_SIGNING_ALLOWED=NO：2c-5 起 Release 用 `Apple Distribution` + 手动
      # provisioning profile 签名，runner 两样都没有。分发身份只落 App 目标，所以这里
      # 也没有别的东西需要证书。少了这一项，门会因为与代码无关的理由变红，而「修好它」
      # 最省事的办法是把证书搬上 CI —— 那不是本轮想要的结果。
      #
      # 自带 derived data：这一步产出的 .app 带生产 bundle id，把它放在 Debug 两步用的
      # 目录之外，后面就不可能有哪一步误把它当成测试宿主捡起来。
      - name: Release-configuration compile gate (build only, unsigned)
        run: |
          xcodebuild \
            -project native/SoloLedger/App/SoloLedger.xcodeproj \
            -scheme SoloLedger \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SoloLedgerReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  # 真 Electron e2e（PR-1 #176 documents fs 分支 + PR-2 #177 attachment IPC）。
  # 仅 workflow_dispatch 手动触发：push/PR 一律不跑、永不作为 merge 门、不入 required checks。
  #   - 与 checks/e2e 两 job 不同，这里要 Electron 二进制 + better-sqlite3 的 ELECTRON ABI
  #     （checks 用的是 node ABI，二者互斥，故必须独立 job）。
  #   - macOS runner 计费 10×，且历史上遇过 spending-limit 阻断，故先手动起步（PR-A）。
  #     待手动跑通且 billing 稳定，再放宽到 push:[main] / PR label（后续 PR-B/PR-C）。
  electron-e2e:
    name: Electron e2e (real main process)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # --ignore-scripts 跳过了 electron 二进制下载 + postinstall 的原生重建。
      # test:electron 在真 Electron 进程内跑，需要：Electron 二进制 + better-sqlite3 的
      # ELECTRON ABI（npm run electron:rebuild = electron-rebuild -f -w better-sqlite3）。
      # 不需要 chromium、也不需要 build（test:electron 既不进浏览器也不读 dist）。
      - name: Install Electron binary
        run: npm rebuild electron
      - name: Rebuild better-sqlite3 for Electron ABI
        run: npm run electron:rebuild
      - name: Run real-Electron e2e
        run: npm run test:electron
